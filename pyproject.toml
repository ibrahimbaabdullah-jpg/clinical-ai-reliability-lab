[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-ai-reliability-lab"
version = "0.1.0"
description = "Retrospective ICU sepsis reliability research workbench"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2", "joblib>=1.4,<2", "duckdb>=1.1,<2",
  "pyarrow>=17,<25", "xgboost>=2.1,<4", "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "PyYAML>=6,<7"
]

[project.optional-dependencies]
deep = ["torch>=2.5,<3"]
tracking = ["mlflow-skinny>=2.17,<4", "sqlalchemy>=2,<3", "alembic>=1.13,<2"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
clinical-lab = "clinical_lab.cli:main"

[tool.setuptools.packages.find]
include = ["clinical_lab*"]

[tool.setuptools.package-data]
clinical_lab = ["web/*", "vendor/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
