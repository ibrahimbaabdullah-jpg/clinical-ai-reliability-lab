ablations: true
bootstrap: 1000
families:
- logistic
- xgboost
- gru
models:
  gru:
    batch_size: 64
    epochs: 20
    hidden_size_grid:
    - 16
    - 32
    learning_rate: 0.001
    patience: 3
  logistic:
    C_grid:
    - 0.01
    - 0.1
    - 1.0
    - 10.0
  xgboost:
    param_grid:
    - learning_rate: 0.05
      max_depth: 3
      n_estimators: 200
    - learning_rate: 0.05
      max_depth: 5
      n_estimators: 300
seed: 2019
stress: true
tracking: true
